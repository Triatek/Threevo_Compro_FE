# Nginx untuk VPS Threevo — satu server block untuk frontend + API.
#
# Salin ke server: /etc/nginx/sites-available/threevo, lalu symlink ke
# sites-enabled. Menggantikan/menyesuaikan blok yang sudah dipasang saat deploy
# backend (lihat docs/FRONTEND_INTEGRATION.md §8 di repo backend).
#
# Keadaan sekarang: baru ada satu alamat IP tanpa domain, jadi frontend dan API
# berbagi origin yang sama dan dibagi per path. Susunan ini justru menguntungkan:
# tidak ada CORS dan cookie sesi admin bekerja apa adanya.
#
# Untuk beralih ke domain threevo.id, lihat deploy/README.md bagian 6.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Upload gambar maks 5 MB + overhead multipart. Nilai ini milik API;
    # frontend statis tidak menerima POST apa pun.
    client_max_body_size 10m;

    # Hasil `npm run build`. Isi folder dist/, bukan folder repo.
    root /var/www/threevo;
    index index.html;

    # ------------------------------------------------------------------
    # Path milik backend
    #
    # Harus berada SEBELUM location / supaya tidak tertelan fallback SPA.
    # Regex location dievaluasi sebelum prefix location di Nginx, jadi urutan
    # penulisannya sebenarnya tidak menentukan — tetap ditaruh di atas agar
    # terbaca sesuai alur.
    #
    # - api/v1     : seluruh endpoint
    # - uploads    : gambar dari panel admin. Tanpa ini gambar tidak tampil
    # - sitemap/robots : dibuat backend, harus satu domain dengan isinya
    # - docs       : Swagger, hanya hidup bila ENABLE_DOCS=true di backend
    # ------------------------------------------------------------------
    location ~ ^/(api/v1|uploads|docs|sitemap\.xml|robots\.txt) {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ------------------------------------------------------------------
    # Kompresi
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ------------------------------------------------------------------
    # Header keamanan dasar
    #
    # CSP sengaja tidak dipasang: Tailwind 4 dan React 19 menyuntikkan <style>
    # inline, dan widget Turnstile memuat skrip dari challenges.cloudflare.com —
    # CSP yang benar perlu diuji dulu supaya tidak mematikan keduanya diam-diam.
    #
    # HSTS juga belum, karena situs masih berjalan di HTTP.
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------
    # Aset hasil build
    #
    # Vite menaruh hash isi di nama berkas (index-a1b2c3d4.js), jadi nama yang
    # sama pasti berisi hal yang sama dan aman di-cache selamanya.
    # ------------------------------------------------------------------
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = /favicon.svg {
        access_log off;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    # ------------------------------------------------------------------
    # index.html jangan pernah di-cache
    #
    # Berkas ini yang menunjuk ke nama aset ber-hash. Kalau ia ikut di-cache,
    # pengunjung lama terus meminta aset versi lama yang sudah terhapus.
    # ------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ------------------------------------------------------------------
    # Fallback SPA — inti berkas ini
    #
    # Routing ditangani react-router di browser, jadi server tidak punya berkas
    # untuk /layanan/fulfillment atau /admin/banners. Tanpa baris try_files di
    # bawah, membuka alamat itu langsung (atau menekan refresh) menghasilkan 404
    # dari Nginx dan aplikasi tidak pernah sempat jalan.
    #
    # Catatan: `error_page 404 /index.html` sengaja TIDAK dipasang. Baris ini
    # sudah menangani alamat halaman, sedangkan aset yang benar-benar hilang
    # harus tetap 404 — bukan dibalas HTML yang gagal di-parse browser.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
